    <link rel="canonical" href="https://messaging-app-frontend-five.vercel.app/" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Relay",
        "url": "https://messaging-app-frontend-five.vercel.app/",
        "applicationCategory": "CommunicationApplication",
        "operatingSystem": "Web",
        "description": "Private realtime messaging with passkeys, 2FA, Telegram OTP, and OAuth.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <style>
      html, body, #root { height: 100%; margin: 0; background: #0e1621; color: #f5f5f5; }
      .boot-screen {
        min-height: 100%;
        display: grid;
        place-items: center;
        font-family: Roboto, "Segoe UI", system-ui, sans-serif;
      }
      .boot-screen strong { font-size: 1.35rem; font-weight: 500; letter-spacing: -0.02em; }
      .boot-screen p { margin: 8px 0 0; color: #708499; font-size: 0.9rem; }
    </style>

  <body>
    <div id="root">
      <div class="boot-screen" role="status" aria-live="polite">
        <div>
          <strong>Relay</strong>
          <p>Loading…</p>
        </div>
      </div>
    </div>
    <noscript>
      <main style="max-width:40rem;margin:2rem auto;padding:1rem;font-family:system-ui,sans-serif">
        <h1>Relay</h1>
        <p>
          Private realtime messaging with passkeys, two-factor authentication, Telegram OTP, and
          OAuth. Enable JavaScript to use the app.

    <script type="module" src="/src/main.tsx"></script>
